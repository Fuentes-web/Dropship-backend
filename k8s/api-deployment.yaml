apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment
  labels:
    app: dropship-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dropship-api
  template:
    metadata:
      labels:
        app: dropship-api
    spec:
      containers:
        - name: dropship-api
          image: dropship-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dropship-secrets
                  key: DATABASE_URL
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: dropship-api-service
  labels:
    app: dropship-api
spec:
  type: NodePort
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
  selector:
    app: dropship-api
